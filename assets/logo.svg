<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>Antigravity Context Plugin</title>
  <!-- Outer frame with ~11% transparent margin for clean rendering in both light & dark themes -->
  <rect x="56" y="56" width="400" height="400" rx="84" fill="#131722" stroke="#3B82F6" stroke-width="14"/>
  <!-- Header status bar -->
  <rect x="104" y="104" width="168" height="20" rx="10" fill="#E2E8F0"/>
  <rect x="336" y="104" width="72" height="20" rx="10" fill="#22C55E"/>
  <!-- 4x4 proportional context usage cell grid -->
  <!-- Row 1: User + Agent + System active cells -->
  <rect x="104" y="156" width="64" height="52" rx="12" fill="#3B82F6"/>
  <rect x="184" y="156" width="64" height="52" rx="12" fill="#3B82F6"/>
  <rect x="264" y="156" width="64" height="52" rx="12" fill="#8B5CF6"/>
  <rect x="344" y="156" width="64" height="52" rx="12" fill="#8B5CF6"/>
  <!-- Row 2: Tool calls + System & Customizations -->
  <rect x="104" y="224" width="64" height="52" rx="12" fill="#F59E0B"/>
  <rect x="184" y="224" width="64" height="52" rx="12" fill="#F59E0B"/>
  <rect x="264" y="224" width="64" height="52" rx="12" fill="#10B981"/>
  <rect x="344" y="224" width="64" height="52" rx="12" fill="#14B8A6"/>
  <!-- Row 3: MCP + Checkpoint + Free capacity cells -->
  <rect x="104" y="292" width="64" height="52" rx="12" fill="#EC4899"/>
  <rect x="184" y="292" width="64" height="52" rx="12" fill="#6366F1" fill-opacity="0.45" stroke="#818CF8" stroke-width="4" stroke-dasharray="8 6"/>
  <rect x="264" y="292" width="64" height="52" rx="12" stroke="#475569" stroke-width="5"/>
  <rect x="344" y="292" width="64" height="52" rx="12" stroke="#475569" stroke-width="5"/>
  <!-- Row 4: Free capacity cells -->
  <rect x="104" y="360" width="64" height="52" rx="12" stroke="#475569" stroke-width="5"/>
  <rect x="184" y="360" width="64" height="52" rx="12" stroke="#475569" stroke-width="5"/>
  <rect x="264" y="360" width="64" height="52" rx="12" stroke="#475569" stroke-width="5"/>
  <rect x="344" y="360" width="64" height="52" rx="12" stroke="#475569" stroke-width="5"/>
</svg>
